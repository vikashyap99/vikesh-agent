# Render Blueprint — deploy via: render.com → New → Blueprint → this repo.
# It reads this file. The app is one Docker container: FastAPI serves the
# built React UI and talks to the cloud APIs (OpenRouter/Groq/Fish Audio).
services:
  - type: web
    name: vik-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free plan. NOTE: Render free services have no persistent disk, spin down
    # after ~15 min of inactivity, and reset the container filesystem on sleep
    # and redeploy. So the voice clone / memory start empty again — re-train the
    # voice once from the UI after a fresh deploy. To keep them permanently,
    # raise the plan (Starter+) and add a disk block.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Paste these three API keys in the Render dashboard when prompted
      # (render.yaml uses sync:false so they are never stored in this file).
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FISH_API_KEY
        sync: false
      # Where runtime data (voice clone, samples, memory, audio) is written.
      # Plain container storage on the free plan (no disk mount).
      - key: VIK_DATA_DIR
        value: /var/data